# Build and deploy to GitHub Pages. Follows the Astro guide:
# https://docs.astro.build/en/guides/deploy/github/
# `npm run build` runs scripts/check.mjs first, so a build with open placeholders fails here.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install, build and upload
        uses: withastro/action@v6
        # Defaults: Node 24, npm (from package-lock.json), `npm run build`, project at repo root.

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
